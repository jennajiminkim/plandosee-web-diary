name: Task 6 checks
on:
  pull_request:
  push:
    branches: [port-task7-ui-no-auth]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser-v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task6-ui-preview
          path: artifacts/
          if-no-files-found: ignore
