name: Task 6 checks
on:
  pull_request:
  push:
    branches: [port-task7-ui-no-auth]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
